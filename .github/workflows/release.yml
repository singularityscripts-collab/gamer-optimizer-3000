name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Compilar instalador
        run: npx electron-builder --win --publish never
      # Publicar pelo gh evita a condição de corrida do electron-builder, que criava releases duplicados.
      - name: Publicar release (o latest.yml alimenta o auto update)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml
